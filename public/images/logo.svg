<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" role="img" aria-label="True Commerce">
  <defs>
    <linearGradient id="tc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Mark: rounded square with T + check -->
  <rect x="2" y="4" width="48" height="48" rx="12" fill="url(#tc-grad)"/>
  <!-- Stylized T -->
  <path d="M14 17 H38 M26 17 V42" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- Tick on the right shoulder of T -->
  <path d="M30 33 L34 37 L42 27" fill="none" stroke="#ffd54a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="62" y="36" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700" fill="#1a1a2e">True<tspan fill="url(#tc-grad)" dx="2">Commerce</tspan></text>
</svg>
